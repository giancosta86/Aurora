name: Verify

on:
  pull_request:
    types: [opened, synchronize]
    branches: main

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: giancosta86/aurora-github/actions/verify-jvm-project@v12
        with:
          java-version: 8.0.502.fx-zulu
          tool-version: 2.10
